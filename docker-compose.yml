services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: tryon
      POSTGRES_PASSWORD: tryon
      POSTGRES_DB: tryon
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tryon -d tryon"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://tryon:tryon@db:5432/tryon
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
